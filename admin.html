<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Painel do lojista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin">
<div id="login" class="login" hidden>
  <form id="loginForm" class="login-card">
    <h1>Painel do lojista</h1>
    <p class="muted">Digite a senha para continuar.</p>
    <div class="f"><label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password"><span class="err">Senha incorreta.</span></div>
    <button class="btn primary" style="width:100%" type="submit">Entrar</button>
    <p class="hint center" style="margin-top:12px"><a href="index.html">← Voltar à loja</a></p>
  </form>
</div>

<div id="app" hidden>
  <header class="a-top">
    <div class="a-in">
      <b>🍇 Painel do lojista</b>
      <div class="a-actions"><a class="btn light sm" href="index.html" target="_blank">Ver loja</a><button class="btn light sm" id="logout">Sair</button></div>
    </div>
    <nav class="a-tabs" id="tabs"></nav>
  </header>
  <main class="a-main">
    <div class="notice" id="notice"></div>
    <div id="view"></div>
  </main>
  <div class="save-bar" id="saveBar" hidden><span>Você tem alterações não salvas.</span><button class="btn green" id="saveBtn">Salvar alterações</button></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="data.js"></script>
<script src="admin.js"></script>
</body>
</html>
